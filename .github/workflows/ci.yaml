name: CI Pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

permissions:
  contents: read
  packages: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Skip auth/pull for forked PRs to avoid failures with private images
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI image
        run: docker pull ghcr.io/ammaralh/pickeycar-ci:latest

      - name: Build in container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/ws" \
            -w /ws \
            ghcr.io/ammaralh/pickeycar-ci:latest \
            bash -lc "source /opt/ros/jazzy/setup.bash && colcon build --merge-install --cmake-args -DCMAKE_BUILD_TYPE=Coverage"
